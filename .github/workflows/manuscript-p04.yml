name: Validate MSC-MUS-P04 protocol
on:
  pull_request:
    paths:
      - 'manuscripts/MSC-MUS-P04/**'
      - '.github/workflows/manuscript-p04.yml'
      - 'validate.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 validate.py
      - name: Install inference dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/p04-venv"
          "$RUNNER_TEMP/p04-venv/bin/pip" install -r manuscripts/MSC-MUS-P04/analysis/requirements.txt
      - name: Test design sensitivity
        working-directory: manuscripts/MSC-MUS-P04/analysis
        run: |
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1
          "$RUNNER_TEMP/p04-venv/bin/python" -m unittest -v
          "$RUNNER_TEMP/p04-venv/bin/python" joint_calibration.py --smoke --reps 2 --m 5 > joint-calibration-smoke.json
          "$RUNNER_TEMP/p04-venv/bin/python" power.py > power-results.json
          "$RUNNER_TEMP/p04-venv/bin/python" simulation.py --reps 250 --imputations 10 > simulation-results.json
          "$RUNNER_TEMP/p04-venv/bin/python" calibration.py --reps 120 --imputations 10 > calibration-results.json
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-bibtex-extra biber lmodern
      - name: Compile prospective protocol
        working-directory: manuscripts/MSC-MUS-P04
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          if grep -Ei 'undefined (references|citations)|citation .* undefined|reference .* undefined' main.log; then exit 1; fi
          test -s main.pdf
          git rev-parse HEAD > exact-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: msc-mus-p04-validation
          path: |
            manuscripts/MSC-MUS-P04/main.pdf
            manuscripts/MSC-MUS-P04/main.log
            manuscripts/MSC-MUS-P04/exact-head.txt
            manuscripts/MSC-MUS-P04/analysis/power-results.json
            manuscripts/MSC-MUS-P04/analysis/joint-calibration-smoke.json
            manuscripts/MSC-MUS-P04/analysis/simulation-results.json
            manuscripts/MSC-MUS-P04/analysis/calibration-results.json
          if-no-files-found: error
