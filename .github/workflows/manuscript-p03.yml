name: Validate MSC-MUS-P03 manuscript
on:
  pull_request:
    paths:
      - 'manuscripts/MSC-MUS-P03/**'
      - '.github/workflows/manuscript-p03.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate repository
        run: python3 validate.py
      - name: Install typesetting tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-bibtex-extra texlive-extra-utils biber lmodern poppler-utils
      - name: Test compiler and unresolved-citation rejection
        working-directory: manuscripts/MSC-MUS-P03
        run: |
          python3 check_pdf.py --self-test
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          checker="$PWD/check_pdf.py"
          (
            cd "$tmp"
            printf '%s\n' '\documentclass{article}' '\begin{document}' '\cite{nonexistent}' '\end{document}' > invalid-citation.tex
            if latexmk -pdf -interaction=nonstopmode -halt-on-error invalid-citation.tex > invalid-citation.stdout 2>&1; then
              if python3 "$checker" invalid-citation.pdf invalid-citation.log; then
                echo "Unresolved citation incorrectly accepted"; exit 1
              fi
            else
              test -s invalid-citation.log
              grep -Ei 'undefined|nonexistent' invalid-citation.log
            fi
            printf '%s\n' '\documentclass{article}' '\begin{document}' '\undefinedtestcommand' '\end{document}' > invalid-source.tex
            if latexmk -pdf -interaction=nonstopmode -halt-on-error invalid-source.tex > invalid-source.stdout 2>&1; then
              echo "Invalid LaTeX incorrectly accepted"; exit 1
            fi
          )
      - name: Compile manuscript
        working-directory: manuscripts/MSC-MUS-P03
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          python3 check_pdf.py main.pdf main.log
          pdfinfo main.pdf > pdf-info.txt
          pdftotext -layout main.pdf main-text.txt
          test -s main-text.txt
          texcount -inc -sum main.tex > word-count.txt
          git rev-parse HEAD > exact-head.txt
          sha256sum main.pdf main.log main.tex references.bib > sha256.txt
          grep -Ei 'Overfull|Underfull|Warning' main.log > layout-warnings.txt || true
      - name: Publish exact-source PDF and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msc-mus-p03-pdf-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            manuscripts/MSC-MUS-P03/main.pdf
            manuscripts/MSC-MUS-P03/main.log
            manuscripts/MSC-MUS-P03/main.blg
            manuscripts/MSC-MUS-P03/pdf-info.txt
            manuscripts/MSC-MUS-P03/main-text.txt
            manuscripts/MSC-MUS-P03/word-count.txt
            manuscripts/MSC-MUS-P03/exact-head.txt
            manuscripts/MSC-MUS-P03/sha256.txt
            manuscripts/MSC-MUS-P03/layout-warnings.txt
          if-no-files-found: warn
