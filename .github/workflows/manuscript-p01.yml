name: Validate AIM-ER manuscript
on:
  pull_request:
    paths:
      - 'manuscripts/MSC-MUS-P01/**'
      - 'validate.py'
      - '.github/workflows/manuscript-p01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate repository
        run: python3 validate.py
      - name: Install analysis dependencies
        working-directory: manuscripts/MSC-MUS-P01/analysis
        run: |
          python3 -m venv "$RUNNER_TEMP/aim-er-venv"
          "$RUNNER_TEMP/aim-er-venv/bin/python" -m pip install -r requirements.txt
      - name: Run synthetic regression tests
        working-directory: manuscripts/MSC-MUS-P01/analysis
        run: |
          OPENBLAS_NUM_THREADS=1 "$RUNNER_TEMP/aim-er-venv/bin/python" -m unittest -v
          "$RUNNER_TEMP/aim-er-venv/bin/python" design_checks.py > design-results.json
          OPENBLAS_NUM_THREADS=1 "$RUNNER_TEMP/aim-er-venv/bin/python" cp_joint_power.py > cp-joint-power.json
          OPENBLAS_NUM_THREADS=1 "$RUNNER_TEMP/aim-er-venv/bin/python" cp_bounded.py --reps 200 --smoke > cp-bounded-screen.json
          OPENBLAS_NUM_THREADS=1 "$RUNNER_TEMP/aim-er-venv/bin/python" cp_bounded_extended.py --reps 50 --workers 2 --smoke --output cp-bounded-extended-screen.json
          OPENBLAS_NUM_THREADS=1 "$RUNNER_TEMP/aim-er-venv/bin/python" longitudinal_checks.py > longitudinal-results.json
          OPENBLAS_NUM_THREADS=1 "$RUNNER_TEMP/aim-er-venv/bin/python" mixed_checks.py --reps 8 > mixed-results.json
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-pictures texlive-bibtex-extra texlive-extra-utils biber lmodern
      - name: Compile manuscript
        working-directory: manuscripts/MSC-MUS-P01
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex supplement.tex
          for document in main supplement; do
            test -s "$document.pdf"
            test -s "$document.log"
            if grep -Ei 'undefined (references|citations)|citation .* undefined|reference .* undefined' "$document.log"; then exit 1; fi
          done
          texcount -inc -sum main.tex > word-count.txt
          texcount -inc -sum supplement.tex > supplement-word-count.txt
          git ls-tree -r HEAD > source-tree.txt
      - name: Publish exact-head validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aim-er-validation
          path: |
            manuscripts/MSC-MUS-P01/main.pdf
            manuscripts/MSC-MUS-P01/main.log
            manuscripts/MSC-MUS-P01/supplement.pdf
            manuscripts/MSC-MUS-P01/supplement.log
            manuscripts/MSC-MUS-P01/supplement-word-count.txt
            manuscripts/MSC-MUS-P01/word-count.txt
            manuscripts/MSC-MUS-P01/source-tree.txt
            manuscripts/MSC-MUS-P01/analysis/design-results.json
            manuscripts/MSC-MUS-P01/analysis/cp-joint-power.json
            manuscripts/MSC-MUS-P01/analysis/cp-bounded-screen.json
            manuscripts/MSC-MUS-P01/analysis/cp-bounded-extended-screen.json
            manuscripts/MSC-MUS-P01/analysis/longitudinal-results.json
            manuscripts/MSC-MUS-P01/analysis/mixed-results.json
          if-no-files-found: error
      - name: Reproduce revised H6 and H10 estimators (Issue 17)
        id: revised
        working-directory: manuscripts/MSC-MUS-P01/analysis
        run: |
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 "$RUNNER_TEMP/aim-er-venv/bin/python" revised_design.py --reps 2000 > revised-design-results.json
          "$RUNNER_TEMP/aim-er-venv/bin/python" - <<'PY'
          import json, subprocess
          from pathlib import Path
          d = json.loads(Path("revised-design-results.json").read_text())
          assert d["sha"] == subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert d["reps"] == 2000
          assert len(d["h6"]) == 12 and len(d["h10"]) == 18
          for kind in ("h6", "h10"):
              for name, row in d[kind].items():
                  assert row["requested"] == 2000 and row["valid"] == 2000 and row["failed"] == 0, (kind, name)
                  assert 0 <= row["coverage"] <= 1 and 0 <= row["rejection"] <= 1, (kind, name)
          print("Exact-head revised-design diagnostic: 30 scenarios, 60,000 valid fits.")
          PY
      - name: Publish revised-design diagnostics (including failed-fit evidence)
        if: ${{ !cancelled() && steps.revised.outcome != 'skipped' && steps.revised.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aim-er-revised-design
          path: manuscripts/MSC-MUS-P01/analysis/revised-design-results.json
          if-no-files-found: error
