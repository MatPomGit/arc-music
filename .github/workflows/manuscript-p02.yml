name: Validate MSC-MUS-P02 protocol
on:
  pull_request:
    paths:
      - 'manuscripts/MSC-MUS-P02/**'
      - '.github/workflows/manuscript-p02.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 -m unittest -v test_export_zotero
      - run: python3 validate.py
      - name: Check protocol structure and citations
        run: python3 manuscripts/MSC-MUS-P02/check_protocol.py
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-bibtex-extra texlive-extra-utils biber lmodern
      - name: Compile
        working-directory: manuscripts/MSC-MUS-P02
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          if grep -Ei 'undefined (references|citations)|citation .* undefined|reference .* undefined' main.log; then exit 1; fi
          test -s main.pdf
          texcount -inc -sum main.tex > word-count.txt
          git rev-parse HEAD > source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: msc-mus-p02-protocol
          path: |
            manuscripts/MSC-MUS-P02/main.pdf
            manuscripts/MSC-MUS-P02/main.log
            manuscripts/MSC-MUS-P02/word-count.txt
            manuscripts/MSC-MUS-P02/source-sha.txt
          if-no-files-found: error
