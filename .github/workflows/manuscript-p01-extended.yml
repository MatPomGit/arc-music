name: Extended AIM-ER Monte Carlo
on:
  pull_request:
    paths:
      - '.github/workflows/manuscript-p01-extended.yml'
      - 'manuscripts/MSC-MUS-P01/analysis/mixed_checks.py'
      - 'manuscripts/MSC-MUS-P01/analysis/longitudinal_checks.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aim-er-extended-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mixed:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        kind: [h6, h10]
        missing: [none, mar, mnar]
        effect: ['null', alternative]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r manuscripts/MSC-MUS-P01/analysis/requirements.txt
      - name: Run exact-SHA scenario
        working-directory: manuscripts/MSC-MUS-P01/analysis
        env:
          KIND: ${{ matrix.kind }}
          MISSING: ${{ matrix.missing }}
          EFFECT: ${{ matrix.effect }}
        run: |
          python mixed_checks.py --kind "$KIND" --missing "$MISSING" --effect "$EFFECT" --reps 2000 --seed 76491 > extended-results.json
          python -m pip freeze > extended-environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mixed-${{ matrix.kind }}-${{ matrix.missing }}-${{ matrix.effect }}
          path: |
            manuscripts/MSC-MUS-P01/analysis/extended-results.json
            manuscripts/MSC-MUS-P01/analysis/extended-environment.txt
          if-no-files-found: error
          retention-days: 30
