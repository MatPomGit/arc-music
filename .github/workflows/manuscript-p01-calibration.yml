name: AIM-ER calibration and sample-size screen
on:
  pull_request:
    paths:
      - '.github/workflows/manuscript-p01-calibration.yml'
      - 'manuscripts/MSC-MUS-P01/analysis/calibration_checks.py'
      - 'manuscripts/MSC-MUS-P01/analysis/test_calibration_checks.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aim-er-calibration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        kind: [h6, h10]
        missing: [none, mar, mnar]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r manuscripts/MSC-MUS-P01/analysis/requirements.txt
      - name: Run calibration screen
        working-directory: manuscripts/MSC-MUS-P01/analysis
        env:
          KIND: ${{ matrix.kind }}
          MISSING: ${{ matrix.missing }}
        run: |
          python calibration_checks.py --kind "$KIND" --missing "$MISSING" --reps 500 --seed 91307 > calibration-results.json
          python -m pip freeze > calibration-environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: calibration-${{ matrix.kind }}-${{ matrix.missing }}
          path: |
            manuscripts/MSC-MUS-P01/analysis/calibration-results.json
            manuscripts/MSC-MUS-P01/analysis/calibration-environment.txt
          if-no-files-found: error
          retention-days: 30
