name: Validate MSC-MUS-P08 protocol
on:
  pull_request:
    paths:
      - 'manuscripts/MSC-MUS-P08/**'
      - '.github/workflows/manuscript-p08.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 validate.py
      - working-directory: manuscripts/MSC-MUS-P08/analysis
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python3 -m venv "$RUNNER_TEMP/p08"
          "$RUNNER_TEMP/p08/bin/pip" install -r requirements.txt
          "$RUNNER_TEMP/p08/bin/python" -m unittest -v
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra lmodern
      - working-directory: manuscripts/MSC-MUS-P08
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          if grep -Ei 'undefined (references|citations)|citation .* undefined|reference .* undefined' main.log; then exit 1; fi
          git rev-parse HEAD > exact-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: msc-mus-p08-validation
          path: |
            manuscripts/MSC-MUS-P08/main.pdf
            manuscripts/MSC-MUS-P08/main.log
            manuscripts/MSC-MUS-P08/exact-head.txt
          if-no-files-found: error
