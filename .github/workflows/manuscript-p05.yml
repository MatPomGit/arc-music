name: MSC-MUS-P05 checks
on:
  pull_request:
    paths:
      - 'manuscripts/MSC-MUS-P05/**'
      - '.github/workflows/manuscript-p05.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - run: pip install -r manuscripts/MSC-MUS-P05/analysis/requirements.txt
      - run: python3 validate.py
      - run: python3 -m unittest discover -s manuscripts/MSC-MUS-P05/analysis -p 'test_*.py'
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            r-base-core=4.5.2-1ubuntu2 r-cran-lavaan=0.6.21-1 \
            r-cran-mass=7.3-65-1 r-cran-mnormt=2.1.2-1 \
            r-cran-pbivnorm=0.6.0-5 r-cran-numderiv=2016.8-1.1-3build1 \
            r-cran-quadprog=1.5-8-1build2 libblas3=3.12.1-7ubuntu1 liblapack3=3.12.1-7ubuntu1
          git rev-parse HEAD > p05-reference-head.txt
          Rscript -e 'sessionInfo()' > p05-reference-environment.txt
          dpkg-query -W r-base-core r-cran-lavaan r-cran-mass r-cran-mnormt r-cran-pbivnorm r-cran-numderiv r-cran-quadprog libblas3 liblapack3 >> p05-reference-environment.txt
          python3 -m pip freeze >> p05-reference-environment.txt
      - run: OPENBLAS_NUM_THREADS=1 python3 manuscripts/MSC-MUS-P05/analysis/compare_lavaan.py --full --archive-dir p05-reference-inputs > p05-lavaan-comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p05-lavaan-comparison-${{ github.event.pull_request.head.sha }}
          path: |
            p05-lavaan-comparison.json
            p05-reference-head.txt
            p05-reference-environment.txt
            p05-reference-inputs/
          if-no-files-found: warn
      - run: OPENBLAS_NUM_THREADS=1 python3 manuscripts/MSC-MUS-P05/analysis/model_comparison.py --smoke --reps 1 --pa-reps 10 > p05-model-comparison-smoke.json
      - run: OPENBLAS_NUM_THREADS=1 python3 manuscripts/MSC-MUS-P05/analysis/factor_count_calibration.py --k 2 --items 3 --n 400 --reps 2 --pa-reps 500 > p05-factor-count-protocol-smoke.json
      - run: OPENBLAS_NUM_THREADS=1 python3 manuscripts/MSC-MUS-P05/analysis/factor_count_calibration.py --k 7 --items 5 --n 400 --reps 2 --pa-reps 20 > p05-factor-count-fullpool-smoke.json
      - run: OPENBLAS_NUM_THREADS=1 python3 manuscripts/MSC-MUS-P05/analysis/interval_calibration.py --reps 2 --boot 99 > p05-interval-calibration.json
      - run: OPENBLAS_NUM_THREADS=1 python3 manuscripts/MSC-MUS-P05/analysis/invariance_power.py --reps 20 > p05-invariance-power.json
      - run: OPENBLAS_NUM_THREADS=1 python3 manuscripts/MSC-MUS-P05/analysis/invariance_family_calibration.py --reps 20 > p05-invariance-family-development.json
      - run: git rev-parse HEAD > p05-development-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p05-recovery-interval-development
          path: |
            p05-model-comparison-smoke.json
            p05-factor-count-protocol-smoke.json
            p05-factor-count-fullpool-smoke.json
            p05-interval-calibration.json
            p05-invariance-power.json
            p05-invariance-family-development.json
            p05-development-head.txt
      - run: python3 manuscripts/MSC-MUS-P05/analysis/recovery.py --reps 12 > p05-recovery.json
      - run: OPENBLAS_NUM_THREADS=1 python3 manuscripts/MSC-MUS-P05/analysis/cfa_calibration.py --reps 8 > p05-cfa-calibration.json
      - run: OPENBLAS_NUM_THREADS=1 python3 manuscripts/MSC-MUS-P05/analysis/robust_calibration.py --reps 30 --full-reps 3 > p05-robust-calibration.json
      - run: OPENBLAS_NUM_THREADS=1 python3 manuscripts/MSC-MUS-P05/analysis/selection_calibration.py --reps 30 > p05-selection-calibration.json
      - run: OPENBLAS_NUM_THREADS=1 python3 manuscripts/MSC-MUS-P05/analysis/invariance_calibration.py --reps 30 > p05-invariance-calibration.json
      - run: OPENBLAS_NUM_THREADS=1 python3 manuscripts/MSC-MUS-P05/analysis/imputation_calibration.py --reps 8 --m 5 --sweeps 20 > p05-imputation-calibration.json
      - run: OPENBLAS_NUM_THREADS=1 python3 manuscripts/MSC-MUS-P05/analysis/fit_calibration.py --reps 30 > p05-fit-calibration.json
      - run: OPENBLAS_NUM_THREADS=1 python3 manuscripts/MSC-MUS-P05/analysis/validity_calibration.py --reps 30 --boot 199 > p05-validity-calibration.json
      - uses: actions/upload-artifact@v4
        with:
          name: p05-synthetic-development
          path: |
            p05-recovery.json
            p05-cfa-calibration.json
            p05-robust-calibration.json
            p05-selection-calibration.json
            p05-invariance-calibration.json
            p05-imputation-calibration.json
            p05-fit-calibration.json
            p05-validity-calibration.json
      - run: sudo apt-get install -y --no-install-recommends lmodern texlive-latex-extra texlive-bibtex-extra texlive-fonts-recommended biber latexmk
      - working-directory: manuscripts/MSC-MUS-P05
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: p05-manuscript
          path: manuscripts/MSC-MUS-P05/main.pdf
