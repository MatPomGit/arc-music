name: Publish website
on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'theme-overrides/**'
      - 'mkdocs.yml'
      - 'requirements-site.txt'
      - 'validate.py'
      - 'check_site.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'pages/**'
      - 'theme-overrides/**'
      - 'mkdocs.yml'
      - 'requirements-site.txt'
      - 'validate.py'
      - 'check_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate sources
        run: python validate.py
      - name: Build website
        run: |
          python -m pip install -r requirements-site.txt
          python -m mkdocs build --strict
          test -f site/index.html
          test -f site/neuropsychology.html
          test -f site/en-neuropsychology.html
          cmp theme-overrides/js/darkmode.js site/js/darkmode.js
          cmp theme-overrides/js/base.js site/js/base.js
      - name: Browser layout checks
        run: |
          python -m pip install playwright==1.57.0
          npm install --prefix "$RUNNER_TEMP/arc-a11y" --ignore-scripts --no-audit --no-fund axe-core@4.10.3
          AXE_PATH="$RUNNER_TEMP/arc-a11y/node_modules/axe-core/axe.min.js" python check_site.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-visual-checks
          path: site-checks/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
