name: Publish website
on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'docs/study-estimates.json'
      - 'docs/research-gates.json'
      - 'check_research_registers.py'
      - 'theme-overrides/**'
      - 'mkdocs.yml'
      - 'requirements-site.txt'
      - 'validate.py'
      - 'check_site.py'
      - 'check_study_registry.py'
      - 'check_public_render.py'
      - 'test_render_regressions.py'
      - 'embed_site_assets.py'
      - 'check_site_regressions.py'
      - 'verify_public.py'
      - 'test_verify_public.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'pages/**'
      - 'docs/study-estimates.json'
      - 'docs/research-gates.json'
      - 'check_research_registers.py'
      - 'theme-overrides/**'
      - 'mkdocs.yml'
      - 'requirements-site.txt'
      - 'validate.py'
      - 'check_site.py'
      - 'check_study_registry.py'
      - 'check_public_render.py'
      - 'test_render_regressions.py'
      - 'embed_site_assets.py'
      - 'check_site_regressions.py'
      - 'verify_public.py'
      - 'test_verify_public.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate sources
        run: |
          python validate.py
          python check_study_registry.py
          python -m unittest -v test_verify_public test_render_regressions test_monte_carlo_runner
      - name: Build website
        run: |
          python -m pip install -r requirements-site.txt
          python -m mkdocs build --strict
          test -f site/index.html
          test -f site/neuropsychology.html
          test -f site/en-neuropsychology.html
          cmp theme-overrides/js/darkmode.js site/js/darkmode.js
          cmp theme-overrides/js/base.js site/js/base.js
      - name: Browser layout checks
        run: |
          python -m pip install playwright==1.57.0
          # Hosted Ubuntu 24.04 includes browser system dependencies.
          # Avoid apt refresh of unrelated third-party package repositories.
          python -m playwright install chromium firefox
          npm install --prefix "$RUNNER_TEMP/arc-a11y" --ignore-scripts --no-audit --no-fund axe-core@4.10.3
          AXE_PATH="$RUNNER_TEMP/arc-a11y/node_modules/axe-core/axe.min.js" python check_site.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-visual-checks
          path: site-checks/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record published file digests
        if: github.ref == 'refs/heads/main'
        run: python verify_public.py manifest site site-files.sha256
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: site-files-manifest
          path: site-files.sha256
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

  verify-public:
    if: github.ref == 'refs/heads/main'
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: site-files-manifest
      - name: Verify deployed website against built files
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python verify_public.py verify site-files.sha256 "$SITE_URL" "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify live rendering in Chromium and Firefox
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          python -m pip install playwright==1.57.0
          # Hosted Ubuntu 24.04 includes browser system dependencies.
          # Avoid apt refresh of unrelated third-party package repositories.
          python -m playwright install chromium firefox
          python check_public_render.py "$SITE_URL"
